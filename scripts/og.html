<!doctype html>
<!--
  Social card source. Playwright renders this to public/og.png at 1200×630.

  Generate:
    npm run og
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mochi's Legacy — og card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,400&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 72px;
        color: #29180C;
        font-family: Fraunces, Georgia, "Times New Roman", serif;
        background-color: #FDFBF7;
        background-image:
          radial-gradient(circle at 50% -8%, rgba(245, 158, 11, 0.28) 0%, rgba(253, 251, 247, 0) 62%),
          radial-gradient(#D97706 0.75px, transparent 0.75px);
        background-size: 100% 100%, 28px 28px;
      }
      body::before {
        content: "";
        position: absolute;
        inset: 28px;
        border: 2px solid #F3D9A2;
        border-radius: 32px;
        pointer-events: none;
      }
      .copy {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 920px;
        text-align: center;
      }
      .paw {
        width: 56px;
        height: 56px;
        margin-bottom: 22px;
      }
      h1 {
        font-size: 84px;
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1.02;
        color: #29180C;
      }
      .mission {
        margin-top: 22px;
        max-width: 820px;
        font-size: 28px;
        font-style: italic;
        font-weight: 400;
        line-height: 1.4;
        color: #B45309;
      }
      .kickoff {
        display: inline-flex;
        align-items: center;
        margin-top: 36px;
        padding: 12px 28px;
        border-radius: 999px;
        background: #2C5E43;
        color: #FDFBF7;
        font-family: system-ui, "Segoe UI", sans-serif;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.01em;
        line-height: 1.2;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <svg class="paw" viewBox="0 0 32 32" aria-hidden="true">
        <ellipse cx="16" cy="22" rx="6.2" ry="5.2" fill="#D97706"/>
        <circle cx="8" cy="13.5" r="2.8" fill="#D97706"/>
        <circle cx="12.5" cy="8.8" r="2.9" fill="#D97706"/>
        <circle cx="19.5" cy="8.8" r="2.9" fill="#D97706"/>
        <circle cx="24" cy="13.5" r="2.8" fill="#D97706"/>
      </svg>
      <h1>Mochi's Legacy</h1>
      <p class="mission">
        A Boulder-area crew of volunteer dogs and handlers sharing comfort
        and joy, one visit at a time.
      </p>
      <p class="kickoff">October 2 · Foothills Community Park, Shelter A</p>
    </div>
    <script type="module">
      await document.fonts.ready;
    </script>
  </body>
</html>
